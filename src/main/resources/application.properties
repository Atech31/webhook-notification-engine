server.port=8080

# Database Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/webhook_engine_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thread Pool Async Settings
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=webhook-exec-

# Retry Config
app.webhook.max-attempts=5
app.webhook.backoff-delay-ms=2000
